name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@f33c11c5cf68957b3074fff11ae43cfce2aaf593 # v2.2.3
    permissions:
      contents: read

  toolchain-pins:
    name: 📌 Toolchain pins
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      bootstrap_revision: ${{ steps.pins.outputs.bootstrap_revision }}
      catalyst_revision: ${{ steps.pins.outputs.catalyst_revision }}
      llvm_install_script_sha256: ${{ steps.pins.outputs.llvm_install_script_sha256 }}
      llvm_revision: ${{ steps.pins.outputs.llvm_revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Read toolchain pins
        id: pins
        run: |
          echo "bootstrap_revision=$(jq -r .bootstrap_revision toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "catalyst_revision=$(jq -r .catalyst_revision toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "llvm_install_script_sha256=$(jq -r .llvm_install_script_sha256 toolchain.json)" >> "$GITHUB_OUTPUT"
          echo "llvm_revision=$(jq -r .llvm_revision toolchain.json)" >> "$GITHUB_OUTPUT"

  cpp-linter:
    name: 🇨 Lint
    needs: [change-detection, toolchain-pins]
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"

      - name: Set up mold as linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Restore pinned toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: catalyst-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ needs.toolchain-pins.outputs.catalyst_revision }}-${{ needs.toolchain-pins.outputs.llvm_revision }}-v${{ needs.toolchain-pins.outputs.bootstrap_revision }}
          path: |
            .cache/catalyst/${{ needs.toolchain-pins.outputs.catalyst_revision }}
            .cache/mlir/${{ needs.toolchain-pins.outputs.llvm_revision }}

      - name: Bootstrap pinned Catalyst and MLIR
        run: bash "$GITHUB_WORKSPACE/scripts/bootstrap.sh"

      - name: Install Clang 21
        env:
          LLVM_INSTALL_SCRIPT_SHA256: ${{ needs.toolchain-pins.outputs.llvm_install_script_sha256 }}
          LLVM_INSTALL_SCRIPT: ${{ runner.temp }}/llvm-install.sh
        run: |
          curl -LsSf https://apt.llvm.org/llvm.sh -o "$LLVM_INSTALL_SCRIPT"
          echo "$LLVM_INSTALL_SCRIPT_SHA256  $LLVM_INSTALL_SCRIPT" | sha256sum --check --strict
          chmod +x "$LLVM_INSTALL_SCRIPT"
          sudo "$LLVM_INSTALL_SCRIPT" 21
          sudo apt-get install -y clang-format-21 clang-tidy-21 clang-tools-21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset lint -B build -DPython_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Build
        run: cmake --build build

      - name: Run C++ linter
        id: linter
        uses: cpp-linter/cpp-linter-action@4f2a4033eda6119c3bf1a4d30857a4c61c11c247 # v2.19.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          database: build
          extra-args: -std=c++20
          files-changed-only: true
          ignore: "build|!build/mlir/**|**/include|include"
          step-summary: true
          style: ""
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' }}
          tidy-checks: ""
          version: 21

      - name: Fail on lint errors
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  python-tests:
    name: 🐍 Test
    needs: [change-detection, toolchain-pins]
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@f33c11c5cf68957b3074fff11ae43cfce2aaf593 # v2.2.3
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-mlir: true
      llvm-version: ${{ needs.toolchain-pins.outputs.llvm_revision }}
    permissions:
      contents: read

  python-coverage:
    name: 🐍 Coverage
    needs: [change-detection, python-tests]
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@f33c11c5cf68957b3074fff11ae43cfce2aaf593 # v2.2.3
    permissions:
      contents: read
      id-token: write

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"

      - name: Run linters
        run: uvx nox -s lint

  build-sdist:
    name: 🚀 CD (sdist)
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@f33c11c5cf68957b3074fff11ae43cfce2aaf593 # v2.2.3
    permissions:
      contents: read

  build-wheel:
    name: 🚀 CD (wheel)
    needs: [change-detection, toolchain-pins]
    if: fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@f33c11c5cf68957b3074fff11ae43cfce2aaf593 # v2.2.3
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-mlir: true
      llvm-version: ${{ needs.toolchain-pins.outputs.llvm_revision }}
    permissions:
      contents: read

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - toolchain-pins
      - cpp-linter
      - python-coverage
      - python-tests
      - python-linter
      - build-sdist
      - build-wheel
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-skips: >-
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-linter)
              && 'cpp-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cd)
              && 'build-sdist,build-wheel' || ''
            }}
          jobs: ${{ toJSON(needs) }}
