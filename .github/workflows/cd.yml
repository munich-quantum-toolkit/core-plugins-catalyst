name: CD 🚀
on:
  workflow_dispatch:

permissions: {}

jobs:
  toolchain-pins:
    name: 📌 Toolchain pins
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      llvm_revision: ${{ steps.pins.outputs.llvm_revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Read toolchain pins
        id: pins
        run: |
          set -euo pipefail
          llvm_revision="$(jq -er .llvm_revision toolchain.json)"
          {
            echo "llvm_revision=${llvm_revision}"
          } >> "$GITHUB_OUTPUT"

  build-sdist:
    name: 🐍 Packaging
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@f33c11c5cf68957b3074fff11ae43cfce2aaf593 # v2.2.3
    permissions:
      contents: read

  # Builds wheels on all supported platforms using cibuildwheel and uploads them as artifacts.
  build-wheel:
    name: 🐍 Packaging
    needs: toolchain-pins
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@f33c11c5cf68957b3074fff11ae43cfce2aaf593 # v2.2.3
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-mlir: true
      llvm-version: ${{ needs.toolchain-pins.outputs.llvm_revision }}
    permissions:
      contents: read
